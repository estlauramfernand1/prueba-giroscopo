<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cohetes Espaciales</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial; text-align: center;
      background: #0a0a2e; color: white;
      height: 100vh; display: flex;
      flex-direction: column; justify-content: space-around;
      padding: 20px; user-select: none;
    }
    h2    { font-size: 1.6em; }
    #estado { font-size: 1.1em; color: #00ff88; }
    #datos  { font-size: 1.2em; color: #aaa; font-weight: bold; }
    #sacudida_val { font-size: 1em; color: #ffff00; }

    .botones {
      display: flex; justify-content: space-between;
      gap: 20px; margin-top: 10px;
    }
    .btn {
      flex: 1; padding: 40px 0; font-size: 2em;
      background: #1a1a5e; color: white;
      border: 2px solid #00ff88; border-radius: 16px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .btn:active { background: #00ff88; color: black; }

    /* Estilos para los botones de control de sensores */
    .btn-sensor {
      padding: 12px 24px; font-size: 1em;
      color: white; border: none; border-radius: 10px;
      margin: 5px auto; cursor: pointer; display: block;
    }
    #btnPermiso { background: #e74c3c; }
    #btnModoPrueba { background: #3498db; }
  </style>
</head>
<body>

  <h2>Carrera Espacial</h2>
  <div id="estado">Conectando...</div>
  <div id="datos">Orientación: —</div>
  <div id="sacudida_val">Sacudida: —</div>

  <!-- Botón original para iPhone cuando ya está conectado -->
  <button id="btnPermiso" class="btn-sensor" style="display:none" onclick="pedirPermiso()">
    Activar sensores (iPhone)
  </button>

  <!-- Botón para forzar la prueba local sin esperar conexión del WebSocket -->
  <button id="btnModoPrueba" class="btn-sensor" onclick="forzarPruebaLocal()">
    Probar Sensores en Local 🛠️
  </button>

  <div class="botones">
    <button class="btn" id="btnIzq">⬅</button>
    <button class="btn" id="btnDer">➡</button>
  </div>

<script>
  const IP_PC = "10.251.226.241";
  
  // CORRECCIÓN CRÍTICA: Cambia de ws:// a wss:// automáticamente si la página es HTTPS
  const protocoloWS = window.location.protocol === "https:" ? "wss" : "ws";
  
  // Si ejecutas tu backend WebSocket en el puerto 8765:
  const ws = new WebSocket(`${protocoloWS}://${IP_PC}:8765`);

  ws.onopen  = () => {
    document.getElementById("estado").textContent = "Ya estás conectado";
    document.getElementById("estado").style.color = "#00ff88";
    document.getElementById("btnModoPrueba").style.display = "none"; 
    iniciarSensores();
  };
  ws.onerror = () => {
    document.getElementById("estado").textContent = "Error de conexión (Aún puedes usar la prueba local)";
    document.getElementById("estado").style.color = "#ff4444";
  };
  ws.onclose = () => {
    document.getElementById("estado").textContent = "Te encuentras desconectado";
    document.getElementById("estado").style.color = "#ff4444";
  };

  function enviar(datos) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(datos));
    }
  }

  // ── BOTONES ─────────────────────────────────────────
  document.getElementById("btnIzq").addEventListener("touchstart", () => enviar({ boton: "izq" }));
  document.getElementById("btnDer").addEventListener("touchstart", () => enviar({ ...datos, boton: "der" }));
  document.getElementById("btnIzq").addEventListener("click", () => enviar({ boton: "izq" }));
  document.getElementById("btnDer").addEventListener("click", () => enviar({ boton: "der" }));

  // ── SENSORES ─────────────────────────────────────────
  function iniciarSensores() {
    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {
      document.getElementById("btnPermiso").style.display = "block";
    } else {
      activarSensores();
    }
  }

  function pedirPermiso() {
    DeviceOrientationEvent.requestPermission().then(r => {
      if (r === "granted") {
        activarSensores();
        document.getElementById("btnPermiso").style.display = "none";
      }
    }).catch(console.error);
  }

  // Fuerza la activación saltándose el estado del WebSocket
  forzarPruebaLocal = () => {
    document.getElementById("estado").textContent = "Modo Prueba Local Activo";
    document.getElementById("estado").style.color = "#ffaa00";
    document.getElementById("btnModoPrueba").style.display = "none";

    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission().then(r => {
        if (r === "granted") {
          activarSensores();
        } else {
          alert("Permiso denegado para la prueba.");
        }
      }).catch(console.error);
    } else {
      activarSensores();
    }
  }

  function activarSensores() {
    // 1. GIRÓSCOPO: Orientación
    window.addEventListener("deviceorientation", (e) => {
      // Si el navegador entrega valores nulos al principio, asignamos 0 temporalmente
      const alpha = e.alpha !== null ? e.alpha.toFixed(1) : "0.0";
      const beta = e.beta !== null ? e.beta.toFixed(1) : "0.0";
      const gamma = e.gamma !== null ? e.gamma.toFixed(1) : "0.0";

      // Si después de iniciar siguen siendo estrictamente nulos, hay un bloqueo mecánico o falta HTTPS
      if (e.alpha === null && e.beta === null && e.gamma === null) {
        document.getElementById("datos").textContent = "Moviendo... (Si no cambia, verifica HTTPS)";
        return;
      }

      // Renderiza los valores en tiempo real en la pantalla del celular en color verde brillante
      document.getElementById("datos").style.color = "#00ff88";
      document.getElementById("datos").textContent = `X(β): ${beta}° | Y(γ): ${gamma}°`;
      
      enviar({
        sensor: "giroscopo",
        alpha: parseFloat(alpha),
        beta: parseFloat(beta),
        gamma: parseFloat(gamma)
      });
    });

    // 2. ACELERÓMETRO: Sacudida
    window.addEventListener("devicemotion", (e) => {
      const a = e.accelerationIncludingGravity;
      if (!a) return;
      
      const sacudida = Math.abs(a.x || 0) + Math.abs(a.y || 0) + Math.abs(a.z || 0);
      document.getElementById("sacudida_val").textContent = `Sacudida: ${sacudida.toFixed(1)}`;
      
      if (sacudida > 12) {
        enviar({ sensor: "acelerometro", sacudida: sacudida });
      }
    });
  }
</script>
</body>
</html>
